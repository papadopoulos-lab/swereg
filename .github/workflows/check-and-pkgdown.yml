on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Lets a pptemplate change be rolled out here without a dummy commit:
  #   gh workflow run check-and-pkgdown.yml --repo papadopoulos-lab/swereg
  workflow_dispatch:

name: Check and pkgdown

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # Pinned P3M snapshot, NOT "latest". qs2 -> stringfish -> RcppParallel.
          # RcppParallel 6.1.1 no longer exports the legacy TBB symbol
          # tbb::internal::concurrent_vector_base_v3::internal_grow_by, which
          # stringfish 0.19.0 still references, so stringfish.so fails to
          # dyn.load and every qs2 call dies -- which is every skeleton and
          # rawbatch read/write. 2026-07-23 is the last CI-green day; it serves
          # RcppParallel 6.0.0 + stringfish 0.19.0. (6.0.0 is fine -- the break
          # is 6.0.0 -> 6.1.1 specifically, not all of 6.x.) The `cran` input
          # needs use-public-rspm: false, which otherwise overrides the mirror
          # with the "latest" URL being pinned away from.
          # Keep in sync with batchit's two workflows. Unpin once stringfish
          # ships a release compatible with RcppParallel 6.1.1.
          use-public-rspm: false
          cran: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-23

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::TrialEmulation
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

  pkgdown:
    needs: R-CMD-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # Same pinned snapshot as the R-CMD-check job above -- pkgdown loads
          # the swereg namespace (and so qs2) to build the reference index.
          # Expect this job to get much slower under the pin: batchit's
          # equivalent went from ~3 min to ~41 min, because the website
          # dependency tree compiles from source at a dated snapshot.
          use-public-rspm: false
          cran: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-23

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::devtools
          needs: website

      - name: Install package
        run: devtools::install()
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages()
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
