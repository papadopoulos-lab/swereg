on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: Check and pkgdown

jobs:
  r-package:
    permissions:
      contents: write
    uses: papadopoulos-lab/pptemplate/.github/workflows/r-package.yml@cc27a7b9c43958e223c717669da67eec32f8a84c
    with:
      extra-packages: any::rcmdcheck, any::TrialEmulation
      # Pinned: RcppParallel 6.1.1 dropped a TBB symbol stringfish 0.19.0 references, so qs2 dies at dyn.load. This snapshot predates it.
      cran: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-23
