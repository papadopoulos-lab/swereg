on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: Check and pkgdown

jobs:
  r-package:
    permissions:
      contents: write
    uses: papadopoulos-lab/pptemplate/.github/workflows/r-package.yml@35754fc8246ffe775e5763ab6ceffa9441eb0244
    with:
      extra-packages: any::rcmdcheck, any::TrialEmulation
      # Pinned: RcppParallel 6.1.1 dropped a TBB symbol stringfish 0.19.0 references, so qs2 dies at dyn.load. This snapshot predates it.
      # The shared workflow takes the distro of the P3M URL from the codename of the runner.
      cran-snapshot: "2026-07-23"

      # 86 is the exact measured ceiling in R/ today. The
      # TTEEnrollment <- R6::R6Class( expression at R/r6_tteenrollment.R:151
      # runs 86 against lintr's default of 15. 78 expressions in all exceed
      # that default. Do not round this number up. The gate permits today's
      # worst case and fails on any increase. An expression MUST NOT grow
      # past 86.
      #
      # This number cannot detect its own staleness. The gate checks every
      # lint-allowlist entry for staleness. It has no such check here, so
      # re-measure the ceiling whenever one of those 78 expressions changes.
      max-cyclocomp: 86
