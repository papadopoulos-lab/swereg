on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: Check and pkgdown

jobs:
  r-package:
    permissions:
      contents: write
    uses: papadopoulos-lab/pptemplate/.github/workflows/r-package.yml@e4e2e58921921752e26a1b6b503a62bbc84e3d18
    with:
      loc-allowlist: |
        R/r6_tteplan.R
        R/r6_tteenrollment.R
        R/r6_registrystudy.R
        R/forest_plot.R
      extra-packages: any::rcmdcheck, any::TrialEmulation
      # Pinned: RcppParallel 6.1.1 dropped a TBB symbol stringfish 0.19.0 references, so qs2 dies at dyn.load. This snapshot predates it.
      cran: https://packagemanager.posit.co/cran/__linux__/noble/2026-07-23
